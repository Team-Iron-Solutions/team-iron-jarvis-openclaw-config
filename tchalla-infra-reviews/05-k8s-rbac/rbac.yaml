---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openjarvis-api-sa
  namespace: production
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/openjarvis-irsa-role
# ⚠️ ISSUE: automountServiceAccountToken should be false (set per-pod if needed)
# automountServiceAccountToken: false
---
# ClusterRole — excessively broad
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openjarvis-api-role
rules:
  # ⚠️ ISSUE: wildcard verbs on core resources — violates least privilege
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # ⚠️ ISSUE: API should NOT need cluster-wide access to secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["*"]
---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openjarvis-api-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openjarvis-api-role
subjects:
  - kind: ServiceAccount
    name: openjarvis-api-sa
    namespace: production
---
# NetworkPolicy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openjarvis-api-netpol
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: openjarvis
      tier: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # ⚠️ ISSUE: Allows all egress — should restrict to ollama-svc, postgres, DNS only
    - {}
